<!DOCTYPE html>
<html lang="en"{{READONLY_ATTR}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Summary</title>
<style>
{{STYLES}}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <h1><a class="header-home" href="#/sessions"><img class="header-icon" src="{{ICON}}" alt="">Night Summary Dashboard</a></h1>
      <div class="subtitle" id="page-subtitle">Session history</div>
    </div>
    <div class="header-right">
      <nav id="nav">
        <a href="#/sessions" class="nav-link active" data-page="sessions">Sessions</a>
        <a href="#/stats" class="nav-link" data-page="stats">Targets</a>
        <a href="#/settings" class="nav-link companion-only" data-page="settings" hidden>Settings</a>
      </nav>
      <!-- Visible only when the dashboard is served from a read-only mirror instance.
           Surfaces the mode to public viewers so they know writes are intentionally
           blocked rather than broken. -->
      <span class="readonly-pill" title="This dashboard is in read-only mode. Write actions are disabled.">Read-Only</span>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode"></button>
    </div>
  </div>
  <div class="header-meta">
    <span>v{{VERSION}} &mdash; by Evan Pegors &bull; @sleepypuppy15</span>
    <span class="header-meta-links">
      <a class="header-meta-btn" href="https://github.com/vorticose/nina.plugin.nightsummary/issues/new?template=bug_report.yml" target="_blank" rel="noopener">Report a Bug</a>
      <a class="header-meta-btn" href="https://github.com/vorticose/nina.plugin.nightsummary/issues/new?template=feature_request.yml" target="_blank" rel="noopener">Suggest a Feature</a>
      <a class="header-meta-btn header-meta-donate" href="https://ko-fi.com/sleepypuppy15" target="_blank" rel="noopener" aria-label="Donate via Ko-fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M6 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/></svg>Donate</a>
    </span>
  </div>
</header>
<div class="shell">
  <div id="companion-banner" class="companion-banner" hidden>
    <div class="companion-banner-info">
      <span class="companion-banner-label">Companion</span>
      <!-- Rig switcher: populated + unhidden by JS only when >1 rig is configured. -->
      <span id="companion-rig-switch" class="companion-rig-switch" hidden></span>
      <span id="companion-banner-status">Checking sync status…</span>
    </div>
    <button id="companion-sync-btn" class="companion-banner-btn" type="button">Sync Now</button>
  </div>
  <div id="content">
    <div class="loading">Loading...</div>
  </div>
  <footer class="footnote"></footer>
</div>
<script>
{{SCRIPTS}}
</script>
</body>
</html>

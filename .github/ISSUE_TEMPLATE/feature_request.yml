name: Feature Request
description: Suggest a new feature or improvement for Night Summary
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe what you'd like to see and why it would be useful.

  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement. What should it do?
      placeholder: "I'd like Night Summary to include a thumbnail of my live stacked image for each target..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: What problem does this solve or what workflow does it improve?
      placeholder: "Currently I have to open Live Stack separately to see what my stacked images look like. Having them in the report would..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area of Night Summary does this relate to?
      options:
        - Report content (charts, stats, images)
        - Report delivery (email, Discord, Pushover)
        - Report appearance (styling, layout, themes)
        - Target Scheduler integration
        - Dashboard / web UI
        - Settings / configuration
        - Other
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you tried any workarounds, or are there other ways this could be solved?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, examples from other tools, or anything else that helps illustrate the idea.
    validations:
      required: false

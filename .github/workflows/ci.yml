name: CI

on:
  push:
    branches: [dev, v3-dev, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NINA.Plugin.NightSummary.sln

      - name: Build
        run: dotnet build NINA.Plugin.NightSummary.sln -c Release --no-restore

      - name: Test with coverage
        run: dotnet test NINA.Plugin.NightSummary.Tests -c Release --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./coverage-results

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: reportgenerator -reports:"./coverage-results/**/coverage.cobertura.xml" -targetdir:"./coverage-report" -reporttypes:"Html;TextSummary"

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $file = Get-ChildItem -Recurse "coverage-results" -Filter "coverage.cobertura.xml" | Select-Object -First 1
          [xml]$coverage = Get-Content $file.FullName
          $lineRate = [double]$coverage.coverage.'line-rate'
          $pct = [math]::Round($lineRate * 100, 1)
          Write-Host "Logic layer line coverage: $pct%"
          Add-Content $env:GITHUB_STEP_SUMMARY "## Coverage: $pct%"
          if ($lineRate -lt 0.60) {
            Write-Error "Coverage $pct% is below the 60% threshold on the logic layer"
            exit 1
          }
          Write-Host "Coverage check passed: $pct% >= 60%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/

      - name: Package plugin
        shell: pwsh
        run: |
          $buildDir = "NINA.Plugin.NightSummary/bin/Release/net8.0-windows"
          $outDir = "artifact"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Get-ChildItem -Path $buildDir -Recurse -File |
            Where-Object { $_.Extension -ne ".pdb" } |
            ForEach-Object {
              $rel = $_.FullName.Substring((Resolve-Path $buildDir).Path.Length + 1)
              $dest = Join-Path $outDir $rel
              $destDir = Split-Path $dest -Parent
              if (!(Test-Path $destDir)) { New-Item -ItemType Directory -Path $destDir -Force | Out-Null }
              Copy-Item $_.FullName $dest
            }

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: NightSummary-dev-${{ github.sha }}
          path: artifact/
          retention-days: 30

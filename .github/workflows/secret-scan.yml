name: secret-scan

on:
  push:
    branches: [main, dev, v3-dev, nina-3.3, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan committed files for secrets and personal infra
        shell: bash
        run: |
          set -uo pipefail
          # Values that must never live in this public repo. The real observatory
          # host/user/keys belong in ~/.claude (uncommitted). See CLAUDE.md
          # "Security: keep infrastructure and secrets out of this repo".
          # NOTE: patterns are deliberately base64-safe (require dots/dashes/prefixes)
          # so they don't false-positive on the base64 image blobs in .preview/*.html.
          patterns=(
            'RBFocus'
            'taile2b1e6'
            'remotetelescope'
            '100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            'ghp_[0-9A-Za-z]{36}'
            '(discord(app)?\.com|hooks\.slack\.com)/api/webhooks/[0-9]{15,}'
          )
          fail=0
          for p in "${patterns[@]}"; do
            if git grep -nIE -e "$p" -- . ':!.github/workflows/secret-scan.yml' ':!scripts/git-hooks/pre-commit'; then
              echo "::error::Forbidden pattern committed: $p"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Secret/infra scan FAILED. Remove the values above - machine-specific"
            echo "infra and secrets belong in ~/.claude, not this public repo."
            exit 1
          fi
          echo "Secret/infra scan passed - no forbidden patterns."
